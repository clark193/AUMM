name: Build site for publication

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'package*.json'
      - 'next.config.*'
      - '.github/workflows/build-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-export
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyCvplh7RaaboMnfzgTVw1LgwWGyfDtbXPc"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "aumm-21dda.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "aumm-21dda"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "aumm-21dda.firebasestorage.app"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "242808651721"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:242808651721:web:70eec6b268228b065d7218"
      NEXT_PUBLIC_SITE_URL: "https://aumm-21dda.web.app"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:firebase -- --webpack
      - uses: actions/upload-artifact@v4
        with:
          name: site-export
          path: out
          include-hidden-files: true
          retention-days: 1
          compression-level: 1
