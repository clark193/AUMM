services:
  - type: web
    name: aumm-notificacoes
    runtime: node
    plan: free
    buildCommand: npm --prefix APP-Mobile/backend ci && npm --prefix APP-Mobile/backend run build
    startCommand: node APP-Mobile/backend/lib/backend/src/server.js
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: GOOGLE_CLOUD_PROJECT
        value: aumm-21dda
      - key: AUMM_EXTERNAL_PUSH
        value: "true"
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
