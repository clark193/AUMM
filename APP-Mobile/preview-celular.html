<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AUMM · Prévia no celular</title>
  <link rel="icon" href="./favicon.svg" />
  <style>
    @font-face{font-family:Manrope;src:url('./fonts/Manrope.ttf');font-weight:200 800;font-display:swap}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#f4eded;color:#48272a;font-family:Manrope,system-ui,sans-serif;overflow:hidden;background-image:radial-gradient(ellipse at 50% 40%,#fffafa 0,transparent 65%)}
    .preview-header{position:fixed;left:35px;top:27px;display:flex;align-items:center;gap:13px;z-index:2}.preview-header img{width:42px;height:38px;object-fit:contain}.preview-header span{font-size:10px;letter-spacing:2px;font-weight:700}.preview-header small{font-size:9px;color:#899584;display:block;letter-spacing:.4px;margin-top:5px;font-weight:500}
    .device-stage{height:100dvh;display:flex;align-items:center;justify-content:center;padding-bottom:30px}.device{position:relative;width:414px;height:886px;padding:12px;background:#222824;border-radius:55px;box-shadow:0 0 0 1px #69766b,0 0 0 4px #374039,0 35px 80px #263c3738,0 70px 140px #263c3718;transform:scale(var(--phone-scale,.82));flex-shrink:0}.device:before{content:'';position:absolute;left:-6px;top:161px;width:3px;height:65px;background:#3b463c;border-radius:4px;box-shadow:0 78px 0 #3b463c}.device:after{content:'';position:absolute;right:-6px;top:200px;width:3px;height:90px;background:#3b463c;border-radius:4px}.screen{width:390px;height:862px;border-radius:43px;overflow:hidden;background:#ffffff;position:relative}.status{height:27px;display:flex;justify-content:space-between;padding:9px 25px 0;font:600 10px Manrope,sans-serif;align-items:center;color:#29372b;background:#ffffff}.status>.icons{display:flex;align-items:center;gap:5px}.signal{font-size:10px;letter-spacing:-2px}.battery{width:17px;height:8px;border:1px solid #29372b;border-radius:2px;position:relative}.battery:after{content:'';position:absolute;background:#29372b;inset:1px;border-radius:1px}.camera{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:8px;height:8px;border:2px solid #253629;background:#15251f;border-radius:50%;box-shadow:inset 0 0 2px #6e899b}.screen iframe{width:390px;height:824px;border:0;display:block;background:#ffffff}.gesture{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);height:4px;width:105px;border-radius:5px;background:#26382b;pointer-events:none}.preview-controls{position:fixed;bottom:21px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:#ffffffc9;border:1px solid #fff;border-radius:30px;padding:5px;box-shadow:0 8px 30px #4c6b4210}.preview-controls button{border:0;background:none;color:#7d8e73;font:600 10px Manrope,sans-serif;padding:9px 14px;border-radius:20px;cursor:pointer;white-space:nowrap}.preview-controls button:hover,.preview-controls button.active{background:#ffe7e9;color:#a90d14}.preview-note{position:fixed;bottom:30px;right:30px;font-size:9px;color:#9aa590;line-height:1.8;text-align:right}button:focus-visible{outline:3px solid #c58549}
    .preview-roles{position:fixed;right:28px;top:26px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:600px}.preview-roles a{background:#fff;border:1px solid #d5dfcf;border-radius:22px;padding:11px 15px;color:#285337;text-decoration:none;font-size:10px;font-weight:700}@media(max-width:700px){.preview-roles{right:12px;top:62px;gap:5px}.preview-roles a{font-size:8px;padding:8px}}
    @media(max-width:700px){.preview-header{left:18px;top:16px}.preview-header img{width:30px;height:28px}.preview-header span{font-size:8px}.preview-header small{font-size:8px}.preview-note{display:none}.preview-controls{bottom:12px}.preview-controls button{font-size:9px;padding:9px 11px}.device-stage{padding-top:15px}}
  </style>
</head>
<body>
  <header class="preview-header"><img src="./logo.png" alt="AUMM" /><span>AUMM · APLICATIVO<small>Prévia interativa para celular</small></span></header>
  <main class="device-stage"><div class="device"><div class="screen"><div class="status"><span>09:41</span><span class="camera" aria-hidden="true"></span><span class="icons"><span class="signal" aria-hidden="true">▂▄▆</span><span aria-hidden="true">◔</span><span class="battery" aria-hidden="true"></span></span></div><iframe title="Aplicativo AUMM no celular" src="./?preview=1" allow="geolocation; web-share" ></iframe><div class="gesture" aria-hidden="true"></div></div></div></main>
  <nav class="preview-controls" aria-label="Telas da prévia"><button data-tab="0" class="active">Início</button><button data-tab="1">Apoio</button><button data-tab="2">Notícias</button><button data-tab="3">Utilidades</button><button data-tab="4">Perfil</button></nav>
  <div class="preview-roles"><a href="./preview-celular.html">Pedir ajuda</a><a href="./preview-celular.html?role=helper">Aceitar como associado</a><a href="./preview-celular.html?role=emergency">Emergência</a><a href="./preview-celular.html?role=admin">Administrador</a><a href="./preview-celular.html?role=map">Mapa ao vivo</a></div><p class="preview-note">Navegue e role a tela do celular.<br/>Pedidos de apoio são simulações locais.</p>
  <script>
    const frame=document.querySelector('iframe');
    const role=new URLSearchParams(location.search).get("role");
    const helperRole=role==="helper";
    if(role==="map"){document.querySelector(".preview-controls").style.display="none";document.querySelector(".preview-note").textContent="Percurso fictício. Sem usar seu GPS.";frame.src="./mapa-preview.html";document.querySelector(".preview-header small").textContent="Como a pessoa de confiança vê o mapa · demonstração";}
    if(role==="emergency"||role==="admin"){frame.src="./?preview=1&role="+role;document.querySelector(".preview-header small").textContent=role==="admin"?"Prévia do administrador · avisos e atendimento":"Prévia do associado · emergência";}
    if(helperRole){frame.src="./?preview=1&role=helper";document.querySelector(".preview-header small").textContent="Prévia do associado · aceitar e ajudar";}
    function resize(){document.documentElement.style.setProperty('--phone-scale',Math.min(.9,(innerHeight-125)/886,(innerWidth-40)/414))}
    addEventListener('resize',resize);resize();
    document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>{
      const target=frame.contentDocument?.querySelectorAll('.bottom-nav button')[Number(button.dataset.tab)];
      target?.click();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b===button));
    }));
  </script>
</body>
</html>
